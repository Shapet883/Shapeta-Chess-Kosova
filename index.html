<style>

 body {

<body>

<p>Faqe për dashamirësit e shahut në Kosovë</p>
</header>

<h2>Mirë se vini!</h2>

<p>
Mirë se vini në SHAPETA CHESS KOSOVA,
hapësira jonë për dashamirësit e shahut.
</p>

<div class="square dark">♜</div>

</div>

<footer>
SHAPETA CHESS KOSOVA 🇽🇰 — Dashamirësit e shahut në Kosovë
</footer>

<script>
const s = document.querySelectorAll(".square");
alert(s.length);
let p = null;

const w = "♔♕♖♗♘♙";
const b = "♚♛♜♝♞♟";

function iw(x) {
return w.includes(x);
}

function ib(x) {
return b.includes(x);
}

function cp(r1, c1, r2, c2) {
const rs = Math.sign(r2 - r1);
const cs = Math.sign(c2 - c1);

let r = r1 + rs;
let c = c1 + cs;

while (r !== r2 || c !== c2) {
if (s[r * 8 + c].textContent.trim() !== "") {
return false;
        }

r += rs;
c += cs;
}

return true;
}

s.forEach(function(x) {
x.addEventListener("click", function() {

if (p === null) {
if (this.textContent.trim() !== "") {
p = this;
p.classList.add("selected");
}
return;
}

if (this === p) {
p.classList.remove("selected");
p = null;
return;
 }

const a = Array.from(s).indexOf(p);
const d = Array.from(s).indexOf(this);

const r1 = Math.floor(a / 8);
const c1 = a % 8;
const r2 = Math.floor(d / 8);
const c2 = d % 8;

const f = p.textContent.trim();
const t = this.textContent.trim();

if (
(iw(f) && iw(t)) ||
            
ib(f) && ib(t))
) {
p.classList.remove("selected");
p = null;
return;
}

let ok = false;

if (f === "♘" || f === "♞") {
const r = Math.abs(r2 - r1);
const c = Math.abs(c2 - c1);

ok =
(r === 2 && c === 1) ||
(r === 1 && c === 2);
}

if (f === "♖" || f === "♜") {
ok =
(r1 === r2 || c1 === c2) &&
cp(r1, c1, r2, c2);
}

if (f === "♗" || f === "♝") {
const r = Math.abs(r2 - r1);
const c = Math.abs(c2 - c1);

ok =
r === c &&
r !== 0 &&
cp(r1, c1, r2, c2);
}

if (f === "♕" || f === "♛") {
const r = Math.abs(r2 - r1);
const c = Math.abs(c2 - c1);

ok =
(
r1 === r2 ||
c1 === c2 ||
r === c
) &&
cp(r1, c1, r2, c2);
}

if (f === "♔" || f === "♚") {
const r = Math.abs(r2 - r1);
const c = Math.abs(c2 - c1);

ok =
r <= 1 &&
c <= 1 &&
(r !== 0 || c !== 0);
}

if (f === "♙") {
if (
c1 === c2 &&
r2 === r1 - 1 &&
t === ""
) {
ok = true;
}

if (
Math.abs(c2 - c1) === 1 &&
r2 === r1 - 1 &&
ib(t)
) {
ok = true;
)

if (
c1 === c2 &&
r1 === 6 &&
r2 === 4 &&
s[(r1 - 1) * 8 + c1].textContent.trim() === "" &&
t === ""
) {
ok = true;
}
}

if (f === "♟") {
if (
c1 === c2 &&
r2 === r1 + 1 &&
t === ""
) {
ok = true;
}

if (
Math.abs(c2 - c1) === 1 &&
r2 === r1 + 1 &&
iw(t)
) {
ok = true;
}

if (
c1 === c2 &&
r1 === 1 &&
r2 === 3 &&
s[(r1 + 1) * 8 + c1].textContent.trim() === "" &&
t === ""
) {
ok = true;
}
}
if (ok) {
this.textContent = f;
p.textContent = "";
}

p.classList.remove("selected");
p = null;
});
});
</script>
